/**

/** 引擎诊断探针：返回各关键组件是否就绪 */

/* 全局错误捕获：插件未捕获异常/未处理 Promise 拒绝记录到宿主日志，超时时可读取 */

/* 任务诊断：任务超时时返回任务/桥/插件状态，定位挂起点 */

  try { return JSON.parse(s); } catch (e) { return s; }

 * axios_1.default.get/post 或直接 axios_1.default({...}) 函数式调用。

// MusicFree 格式插件适配器：将 search(query, page) → search(keyword, page, type)
// 同时转换返回值 { isEnd, data } → [...]
function __wrapMusicFreeIfNeeded(obj, name) {
  // 精准检测 MusicFree 格式：有 primaryKey / supportedSearchType / srcUrl 独有字段，

    !(typeof obj.getMusicUrl === 'function' || typeof obj.getMusicInfo === 'function');

  wrapped.search = async function (keyword, page, type) {
    var query = { keyword: keyword, toString: function () { return keyword; } };
    var result = await obj.search(query, page || 1, type || 'music');
    if (result && result.data && Array.isArray(result.data)) {
      return result.data.map(function (item) {
        return {
          id: item.id || '',
          songId: item.songId || item.id || '',
          name: item.title || item.name || '',
          title: item.title || '',
          singer: item.artist || item.singer || item.artist || '',
          artist: item.artist || '',
          album: item.album || item.album_name || '',
          albumName: item.album_name || item.album || '',
          pic: item.artwork || item.pic || item.cover || '',
          picUrl: item.artwork || item.pic || '',
          url: item.url || '',

  function __mfQuality(q) {
    var s = String(q || '').toLowerCase();
    if (s === '128k' || s === '128' || s === 'low') return 'low';
    if (s === '320k' || s === '320' || s === 'standard') return 'standard';
    if (s === 'flac' || s === 'flac24bit' || s === 'high' || s === 'lossless') return 'high';

    wrapped.getMusicUrl = async function (songInfo, quality) {
      try {
        var result = await obj.getMediaSource(songInfo, __mfQuality(quality));
        if (typeof result === 'string') return result;
        if (result && result.url) return result.url;
        return '';
      } catch (_e) { return ''; }

      try {
        var result = await obj.getMediaSource(songInfo, __mfQuality(quality));
        if (typeof result === 'string') return result;
        if (result && result.url) return result.url;
        return '';
      } catch (_e) { return ''; }
    };
    wrapped.getLyric = async function (songInfo) {
      try {
        var result = await obj.getMediaSource(songInfo, 'low');
        if (result && result.rawLrc) return result.rawLrc;
        return '';
      } catch (_e) { return ''; }
    };

    wrapped.getMusicUrl = async function (songInfo, quality) {
      try {
        var result = await getUrlFn(songInfo, quality);
        if (typeof result === 'string') return result;
        if (result && result.url) return result.url;
        return '';
      } catch (_e) { return ''; }
    };
  } else {
    wrapped.getMusicUrl = async function () { return ''; };
  }
  if (typeof obj.getLyric === 'function' && typeof obj.getMediaSource !== 'function') {
    wrapped.getLyric = async function (songInfo) {
      try {

        if (typeof result === 'string') return result;
        if (result && result.lyric) return result.lyric;

function __startTask(name, src, func, argsJson) {
