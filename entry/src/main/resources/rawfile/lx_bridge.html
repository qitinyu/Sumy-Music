            method: method,
            headers: headers,
            body: body,
            timeout: timeout
          }
        });

        var timeoutId = setTimeout(function() {
          var entry = nativeFetchRequests[requestId];
          if (entry) {
            delete nativeFetchRequests[requestId];
            entry.callback(new Error('Request timeout'), null, null);
          }
        }, timeout);
        nativeFetchRequests[requestId].timeoutId = timeoutId;

        return function abort() {
          var entry = nativeFetchRequests[requestId];
          if (entry) {
            clearTimeout(entry.timeoutId);
            delete nativeFetchRequests[requestId];
          }
        };
      },
      send: function(eventName, data) {
        return new Promise(function(resolve, reject) {
          if (eventNames.indexOf(eventName) === -1) return reject(new Error('The event is not supported: ' + eventName));
          switch (eventName) {
            case EVENT_NAMES.inited:
              if (isInitedApi) return reject(new Error('Script is inited'));
              isInitedApi = true;
              handleInit(this, data);
              resolve();
              break;
            case EVENT_NAMES.updateAlert:
              if (isShowedUpdateAlert) return reject(new Error('The update alert can only be called once.'));
              isShowedUpdateAlert = true;
              handleShowUpdateAlert(data, resolve, reject);
              break;
            default:
              reject(new Error('Unknown event name: ' + eventName));
          }
        });
      },
      on: function(eventName, handler) {
        if (eventNames.indexOf(eventName) === -1) return Promise.reject(new Error('The event is not supported: ' + eventName));
        switch (eventName) {
          case EVENT_NAMES.request:
            events.request = handler;
            break;
          default: return Promise.reject(new Error('The event is not supported: ' + eventName));
        }
        return Promise.resolve();
      },
      utils: {
        crypto: {
          aesEncrypt: function(buffer, mode, key, iv) {
            return cryptoAesEncrypt(buffer, mode, key, iv);
          },
          rsaEncrypt: function(buffer, key) {
            return cryptoRsaEncrypt(buffer, key);
          },
          randomBytes: function(size) {
            return cryptoRandomBytes(size);
          },
          md5: function(str) {
            return md5(str);
          }
        },
        buffer: {
          from: function() {
            return BufferPolyfill.from.apply(BufferPolyfill, arguments);
          },
          bufToString: function(buf, format) {
            return bufToString(buf, format);
          }
        },
        zlib: {
          inflate: function(buf) {
            return zlibInflate(buf);
          },
          deflate: function(data) {
            return zlibDeflate(data);
          }
        }
      },
      currentScriptInfo: {
        name: initData.name || '',
        description: initData.description || '',
        version: initData.version || '',
        author: initData.author || '',
        homepage: initData.homepage || '',
        rawScript: initData.script || ''
      },
      version: '2.0.0',
      env: 'mobile'
    };

    window.addEventListener('error', function(event) {
      if (event.isTrusted) onError(event.message.replace(/^Uncaught\sError:\s/, ''));
    });
    window.addEventListener('unhandledrejection', function(event) {
      if (!event.isTrusted) return;
      var message = typeof event.reason === 'string' ? event.reason : (event.reason && event.reason.message) ? event.reason.message : String(event.reason);
      onError(message.replace(/^Error:\s/, ''));
    });

    try {
      eval(initData.script);
    } catch(e) {
      onError(e.message);
    }
  };

  window._lx_handleRequest = function(reqKey, reqDataJson) {
    try {
      var reqData = JSON.parse(reqDataJson);
      handleRequest(window, { requestKey: reqKey, data: reqData });
    } catch(e) {
      sendToNative({ event: 'response', data: { requestKey: reqKey, status: false, message: e.message } });
    }
  };

})();
</script>
